<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Auto Detailing | Luxury Mobile Car Detailing in Miami, FL</title>
    <meta
      name="description"
      content="Premium mobile auto detailing in Miami, FL. Professional exterior detailing, deep interior cleaning, paint restoration, and ceramic coating delivered to your driveway."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Apex Auto Detailing | Luxury Mobile Car Detailing in Miami, FL" />
    <meta
      property="og:description"
      content="Premium mobile auto detailing in Miami, FL. Professional care, exceptional results, and convenience delivered directly to your driveway."
    />
    <meta property="og:site_name" content="Apex Auto Detailing" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apex Auto Detailing | Luxury Mobile Car Detailing in Miami, FL" />
    <meta
      name="twitter:description"
      content="Premium mobile auto detailing in Miami. Book exterior detailing, interior deep cleaning, or ceramic coating at your location."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoWash",
        "name": "Apex Auto Detailing",
        "description": "Luxury mobile car detailing in Miami, Florida offering exterior detailing, interior detailing, full detail packages, paint restoration, and ceramic coating.",
        "areaServed": {
          "@type": "City",
          "name": "Miami",
          "containedInPlace": {
            "@type": "State",
            "name": "Florida"
          }
        },
        "telephone": "+1-305-890-4210",
        "email": "concierge@apexautodetailing.com",
        "priceRange": "$$$"
      }
    </script>
  </head>
  <body class="bg-[#08080A] text-[#F8FAFC] antialiased selection:bg-[#FF5500] selection:text-white">
    <!-- Hidden static form for automatic Netlify Forms detection at build time -->
    <form name="apex-booking-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="vehicleMakeModel" />
      <input type="text" name="vehicleType" />
      <input type="text" name="desiredService" />
      <input type="text" name="preferredDate" />
      <input type="text" name="serviceLocation" />
      <textarea name="additionalDetails"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
